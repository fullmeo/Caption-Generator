# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Base directory for the build
  base = "frontend"

  # Build command
  command = "npm run build"

  # Directory with build output
  publish = "dist"

# Production environment variables
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Headers for security and PWA
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # PWA headers
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache PWA icons
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Cache service worker (important!)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA redirect - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy (optional - if backend is also on Netlify)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.com/:splat"
#   status = 200
#   force = true

# Redirect http to https
[[redirects]]
  from = "http://caption-generator.netlify.app/*"
  to = "https://caption-generator.netlify.app/:splat"
  status = 301
  force = true

# Build plugins
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # Lighthouse config
  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 0.95
    best-practices = 0.95
    seo = 1.0
    pwa = 1.0
